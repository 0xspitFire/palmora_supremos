services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:stable
    command: ["anvil", "--chain-id", "31337", "--block-time", "1", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:8545:8545"
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
