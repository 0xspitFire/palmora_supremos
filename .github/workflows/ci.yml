name: CI

on:
  push:
    branches: [main, phase1-integration]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  environment:
    runs-on: [self-hosted, linux, wsl]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.1
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1
      - name: Verify native WSL toolchain
        run: pnpm ops:environment

  verify:
    needs: environment
    runs-on: [self-hosted, linux, wsl]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.1
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1
      - name: Verify native WSL toolchain
        run: pnpm ops:environment
      - name: Install SQLite backup tool
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes sqlite3
      - run: pnpm install --frozen-lockfile
      - run: pnpm ops:clean-checkout
      - run: pnpm lint
      - run: pnpm ops:secret-boundary
      - run: pnpm ops:policy
        env:
          ROBINHOOD_MINT_TYPE: FREE
          ROBINHOOD_PRIORITY_FEE_WEI: "0"
          ROBINHOOD_FREE_MINT_VALUE_WEI: "0"
          ROBINHOOD_L2_EXECUTION_FEE_WEI: "1"
          ROBINHOOD_L2_GAS_RESERVE_WEI: "1"
          ROBINHOOD_L1_DATA_FEE_WEI: "1"
          ROBINHOOD_L1_DATA_GAS_RESERVE_WEI: "1"
          ROBINHOOD_FREE_WALLET_CAP_WEI: "200000000000000"
          ROBINHOOD_FREE_PERIOD_CAP_WEI: "2000000000000000"
      - run: pnpm ops:negative-cases
      - run: pnpm ops:recovery-drill
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test -- --reporter=dot
      - name: Check for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  anvil:
    needs: environment
    runs-on: [self-hosted, linux, wsl]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.1
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1
      - name: Verify native WSL toolchain
        run: pnpm ops:environment
      - run: pnpm install --frozen-lockfile
      - name: Run strict archive fork replay
        run: pnpm ops:fork-replay

  docker:
    needs: environment
    runs-on: [self-hosted, linux, wsl]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.1
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1
      - name: Verify native WSL toolchain
        run: pnpm ops:environment
      - name: Build production image
        run: docker build --tag mint-bot:ci .
      - name: Verify fail-closed container health
        shell: bash
        run: |
          set +e
          docker run --rm --entrypoint node mint-bot:ci scripts/healthcheck.mjs
          status=$?
          set -e
          test "$status" -ne 0

  archive-fork-replay:
    if: github.event_name == 'workflow_dispatch' && vars.ARCHIVE_FORK_RUNNER == 'true'
    needs: environment
    runs-on: [self-hosted, linux, wsl]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.1
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1
      - name: Verify native WSL toolchain
        run: pnpm ops:environment
      - run: pnpm install --frozen-lockfile
      - run: pnpm ops:fork-replay

  ethereum-fork-replay:
    if: github.event_name == 'workflow_dispatch' && vars.ARCHIVE_FORK_RUNNER == 'true'
    needs: environment
    runs-on: [self-hosted, linux, wsl]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.1
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1
      - name: Verify native WSL toolchain
        run: pnpm ops:environment
      - run: pnpm install --frozen-lockfile
      - run: pnpm ops:ethereum-fork
